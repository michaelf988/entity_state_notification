blueprint:
  name: "💬 Zustandsbenachrichtigung (Blueprint v1.6)"
  description: >
    **Changelog v1.6:**
    - FIX: Periodische Wiederholung funktioniert auch nach einem Reload der Automationen (z. B. Speichern, Blueprint-Re-Import), nicht erst nach HA-Neustart.

    **Changelog v1.5:**
    - FIX: Mehrfach-Zustände und Multi-Numerik lösen pro Zustandsänderung nur noch einen Lauf aus; Attributänderungen werden ignoriert. Gemeldet wird nur beim Eintritt in den Zielzustand bzw. beim Überschreiten der Schwelle.
    - FIX: Clear geht an die konfigurierten Geräte/Gruppen (statt notify.notify) und nur, wenn vorher der Zielzustand bzw. die Schwelle erreicht war.
    - FIX: Multi-Numerik: nicht-numerische Zustände (unavailable, unknown) lösen weder Alarm noch Clear aus (kein Fehlalarm durch float(0) mehr).
    - FIX: Verweilzeit (Multi-Numerik, Mehrfach-Zustände) entprellt jetzt wirklich: Meldung erst, wenn die Bedingung die ganze Dauer erfüllt war.
    - FIX: Actionable Notifications vom Typ ha_action führen die HA-Aktion beim Antippen wieder aus (wait.trigger wurde als String ausgewertet).
    - OPT: Eine neue Meldung beendet ältere wartende Läufe derselben Entität (keine doppelten Periodik-Schleifen/Aktionen).
    - OPT: Syntax vereinheitlicht (triggers/conditions/actions).

    **Changelog v1.4:**
    - FIX: Actionable Notifications funktionieren nun auch während der periodischen Wartezeit (kein Blockieren mehr).
    - FIX: Diverse Tippfehler in Variablennamen behoben (create_notification, periodical).
    - OPT: Timeout-Logik vereinfacht.

    Benachrichtigt dich, wenn ausgewählte Entitäten einen Zielzustand erreichen
    (oder numerisch darüber/darunter liegen). Optional periodische Wiederholung,
    Aktionen und Bedingungen.
  source_url: https://github.com/michaelf988/entity_state_notification/blob/main/entity_state_notification.yaml
  domain: automation

  input:
    sensor_section:
      name: Entitäten / Gleichheitsvergleich
      icon: mdi:equal-box
      collapsed: true
      input:
        input_entities:
          name: "🖲️ Beobachtete Entitäten"
          description: >
            Entitäten, die die Benachrichtigung auslösen.
          default: []
          selector:
            entity:
              multiple: true

        input_entity_states:
          name: "🟢 Zielzustände"
          description: >
            Zustände, die die Automatisierung auslösen.
          default: []
          selector:
            text:
              multiple: true

        input_entity_state_duration:
          name: "⏲️ Verweilzeit im Zielzustand"
          description: >
            Dauer, die die Entität im Zielzustand sein muss.
          default:
            hours: 0
            minutes: 0
            seconds: 2
          selector:
            duration:

    # Mehrere "normale" Zustände (indexbasiert)
    state_multi_section:
      name: Mehrere Zustände (indexbasiert)
      icon: mdi:format-list-bulleted
      collapsed: true
      input:
        ms_entities:
          name: "🖲️ Entitäten (Mehrfach)"
          description: >
            Liste der zu überwachenden Entitäten. Die Position entspricht den
            Zielzuständen in der nächsten Liste.
          default: []
          selector:
            entity:
              multiple: true

        ms_target_states:
          name: "🟢 Zielzustände je Entität"
          description: >
            Für jede Entität ein Eintrag. Mehrere Zustände pro Eintrag mit | oder , trennen
            (z. B. "on|open", "home,available").
          default: []
          selector:
            text:
              multiple: true

    # Mehrere numerische Vergleiche (indexbasiert, Operator im Feld)
    numeric_multi_section:
      name: Mehrere numerische Vergleiche (indexbasiert)
      icon: mdi:view-list
      collapsed: true
      input:
        nm_entities:
          name: "🖲️ Numerische Entitäten (Mehrfach)"
          description: >
            Liste der zu überwachenden numerischen Entitäten. Die Position
            entspricht dem passenden Schwellwert unten.
          default: []
          selector:
            entity:
              multiple: true

        nm_thresholds:
          name: "🟢 Schwellwerte je Entität (mit Operator)"
          description: >
            Pro Entität genau ein Eintrag mit Operator **<** oder **>** und Zahl.
            Beispiele: `>5`, `<1,2`, `> 12.3`. Dezimal-Komma wird unterstützt.
          default: []
          selector:
            text:
              multiple: true

        input_numeric_entity_state_duration:
          name: "⏲️ Verweilzeit (Multi-Numerik)"
          description: >
            Dauer, die die Bedingung (> oder <) ununterbrochen erfüllt sein muss,
            bevor benachrichtigt wird. 0 = sofort.
          default:
            hours: 0
            minutes: 0
            seconds: 2
          selector:
            duration:

    notification_section:
      name: Benachrichtigung
      icon: mdi:chat
      collapsed: true
      input:
        input_notify_devices:
          name: "📱 Gerät(e) benachrichtigen"
          description: >
            Geräte/Gruppen, die die Benachrichtigung erhalten.
          default: []
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app

        input_notify_groups:
          name: "🫂 Benachrichtigungsgruppen"
          description: >
            Namen von Notification-Gruppen (notify.Gruppenname).
          default: []
          selector:
            text:
              multiple: true

        input_title:
          name: "📕 Titel"
          description: >
            Titel der Benachrichtigung.
          default: "{{ entity_name }} ist {{ new_state }}"

        input_message:
          name: "💬 Nachricht"
          description: >
            Text der Benachrichtigung.
          default: "Hinweis: {{ entity_name }} ist {{ new_state }}"

        input_persistent_notification:
          name: "🪨 Persistente Benachrichtigung"
          description: >
            Kann nicht weggewischt werden; verschwindet erst,
            wenn die Entität den Zielzustand verlässt.
          default: false
          selector:
            boolean:

        input_notification_auto_delete:
          name: "❌ Auto-Schließen"
          description: >
            Benachrichtigungen automatisch schließen,
            wenn die Zielzustands-Bedingung nicht mehr gilt.
          default: true
          selector:
            boolean:

        input_ha_notification:
          name: "🏠 HA-Benachrichtigung (Frontend)"
          description: >
            Erstellt zusätzlich eine persistente Benachrichtigung im HA-Frontend.
          default: false
          selector:
            boolean:

        # iOS / allgemeine Felder
        input_interruption_level:
          name: "⛔ Interruption Level (iOS)"
          description: >
            Einstellen, wie „dringlich“ die Benachrichtigung ist.
          default: "active"
          selector:
            select:
              options:
                - passive
                - active
                - time-sensitive
                - critical

        input_custom_tag:
          name: "🏷️ Tag"
          description: >
            Tag für die Benachrichtigung (zur späteren Identifikation).
            Leer lassen, um einen Tag automatisch zu generieren.
          default: ""
          selector:
            text:

        input_ios_sound:
          name: "🔊 iOS Sound"
          description: >
            Name des Sounds (z. B. default oder <Soundname>).
          default: "default"
          selector:
            text:

        input_group_text:
          name: "📑 Group"
          description: >
            Gruppiere Benachrichtigungen über diese Kennung.
          default: ""
          selector:
            text:

    actionable_section:
      name: Actionable Notifications
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        input_action_timeout:
          name: "⏳ Antwort-Timeout"
          description: >
            Wartezeit auf eine Antwort-Aktion (nur relevant, wenn keine periodische Wiederholung aktiv ist).
          default:
            hours: 0
            minutes: 0
            seconds: 60
          selector:
            duration:

        # Action 1
        input_action1_enabled:
          name: "Aktion 1 aktivieren"
          default: false
          selector:
            boolean:
        input_action1_title:
          name: "Titel Aktion 1"
          default: "Aktion 1"
          selector:
            text:
        input_action1_type:
          name: "Typ Aktion 1"
          default: "uri"
          selector:
            select:
              options:
                - uri
                - ha_action
        input_action1_uri:
          name: "URI Aktion 1 (falls Typ=uri)"
          default: ""
          selector:
            text:
        input_action1_destructive:
          name: "Destructive (Aktion 1)"
          default: false
          selector:
            boolean:
        input_action1_ha_action:
          name: "HA-Aktion bei Antwort (Aktion 1, falls Typ=ha_action)"
          default: []
          selector:
            action: {}

        # Action 2
        input_action2_enabled:
          name: "Aktion 2 aktivieren"
          default: false
          selector:
            boolean:
        input_action2_title:
          name: "Titel Aktion 2"
          default: "Aktion 2"
          selector:
            text:
        input_action2_type:
          name: "Typ Aktion 2"
          default: "uri"
          selector:
            select:
              options:
                - uri
                - ha_action
        input_action2_uri:
          name: "URI Aktion 2 (falls Typ=uri)"
          default: ""
          selector:
            text:
        input_action2_destructive:
          name: "Destructive (Aktion 2)"
          default: false
          selector:
            boolean:
        input_action2_ha_action:
          name: "HA-Aktion bei Antwort (Aktion 2, falls Typ=ha_action)"
          default: []
          selector:
            action: {}

        # Action 3
        input_action3_enabled:
          name: "Aktion 3 aktivieren"
          default: false
          selector:
            boolean:
        input_action3_title:
          name: "Titel Aktion 3"
          default: "Aktion 3"
          selector:
            text:
        input_action3_type:
          name: "Typ Aktion 3"
          default: "uri"
          selector:
            select:
              options:
                - uri
                - ha_action
        input_action3_uri:
          name: "URI Aktion 3 (falls Typ=uri)"
          default: ""
          selector:
            text:
        input_action3_destructive:
          name: "Destructive (Aktion 3)"
          default: false
          selector:
            boolean:
        input_action3_ha_action:
          name: "HA-Aktion bei Antwort (Aktion 3, falls Typ=ha_action)"
          default: []
          selector:
            action: {}

    peridodic_notification_section:
      name: Periodische Benachrichtigungen
      icon: mdi:refresh
      collapsed: true
      input:
        input_period:
          name: "🔄 Wiederholung"
          description: >
            Sendet periodisch Benachrichtigungen (0 = aus).
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

        input_stop_button_text:
          name: "💬 Stopp-Button-Text"
          description: >
            Text für den Button, der die Wiederholung stoppt.
          default: "Stop notifying"

    custom_section:
      name: Eigene Aktionen / Bedingungen
      icon: mdi:cog
      collapsed: true
      input:
        input_custom_condition:
          name: "❌ Bedingungen"
          description: >
            Bedingungen, die erfüllt sein müssen.
          default: []
          selector:
            condition:

        input_custom_action_on:
          name: "🎬 Eigene Aktion bei Eintritt"
          description: >
            Wird ausgeführt, wenn die Entität den Zielzustand erreicht.
          default: []
          selector:
            action: {}

        input_custom_action_off:
          name: "🎬 Eigene Aktion bei Verlassen"
          description: >
            Wird ausgeführt, wenn die Entität den Zielzustand verlässt.
          default: []
          selector:
            action: {}

trigger_variables:
  input_entities: !input input_entities

triggers:
  # Gleichheitsvergleiche (einfach)
  - id: "state_on"
    trigger: state
    entity_id: !input input_entities
    to: !input input_entity_states
    for: !input input_entity_state_duration

  - id: "state_off"
    trigger: state
    entity_id: !input input_entities
    not_to: !input input_entity_states

  # Multi-State via Index (ein Trigger; Eintritt/Verlassen per Template,
  # Verweilzeit per wait_template im Aktionsteil)
  # to: ~ -> nur echte Zustandsänderungen, keine Attributänderungen
  - id: "ms"
    trigger: state
    entity_id: !input ms_entities
    to: ~

  # Multi-Numeric via Index (ein Trigger; Schwelle per Template,
  # Verweilzeit per wait_template im Aktionsteil)
  - id: "num_multi"
    trigger: state
    entity_id: !input nm_entities
    to: ~

  # Periodik. Kein event_data-Filter auf this.entity_id: Trigger-Templates
  # werden beim Anhängen gerendert, nach einem Reload ist "this" dort leer und
  # der Trigger passt nie. Zuordnung zur Automation erfolgt in conditions.
  - id: "period"
    trigger: event
    event_type: esn_event

variables:
  # Inputs / Benachrichtigung
  input_period: !input input_period
  input_notify_devices: !input input_notify_devices
  input_notify_groups: !input input_notify_groups
  input_stop_button_text: !input input_stop_button_text
  input_entity_states: !input input_entity_states
  input_entity_state_duration: !input input_entity_state_duration
  input_notification_auto_delete: !input input_notification_auto_delete
  input_interruption_level: !input input_interruption_level
  input_ios_sound: !input input_ios_sound
  input_group_text: !input input_group_text
  input_custom_tag: !input input_custom_tag

  # Actionable inputs
  input_action_timeout: !input input_action_timeout
  a1_enabled: !input input_action1_enabled
  a1_title: !input input_action1_title
  a1_type: !input input_action1_type
  a1_uri: !input input_action1_uri
  a1_destructive: !input input_action1_destructive
  a1_ha_action: !input input_action1_ha_action
  a2_enabled: !input input_action2_enabled
  a2_title: !input input_action2_title
  a2_type: !input input_action2_type
  a2_uri: !input input_action2_uri
  a2_destructive: !input input_action2_destructive
  a2_ha_action: !input input_action2_ha_action
  a3_enabled: !input input_action3_enabled
  a3_title: !input input_action3_title
  a3_type: !input input_action3_type
  a3_uri: !input input_action3_uri
  a3_destructive: !input input_action3_destructive
  a3_ha_action: !input input_action3_ha_action

  # Multi-State Listen
  ms_entities: !input ms_entities
  ms_target_states: !input ms_target_states

  # Multi-Numeric Listen (Operator im Schwellwert)
  nm_entities: !input nm_entities
  nm_thresholds: !input nm_thresholds
  input_numeric_entity_state_duration: !input input_numeric_entity_state_duration

  # Helper
  is_period_trigger: "{{ trigger.id == 'period' }}"
  now_ts: "{{ now() }}"
  # Berechne Periodik (Prüfung, ob Periode > 0 ist)
  period_seconds: "{{ timedelta(**input_period).total_seconds() | int }}"
  is_periodical: "{{ period_seconds > 0 }}"

  entity: >
    {% if is_period_trigger %}
      {{ trigger.event.data.entity }}
    {% else %}
      {{ trigger.entity_id }}
    {% endif %}
  entity_name: "{{ state_attr(entity, 'friendly_name') }}"

  action_tag: "STOP_{{ this.entity_id }}_{{ entity }}"
  default_tag: "{{ this.entity_id.split('.')[1] + entity.split('.')[1] }}"
  tag: >
    {% set t = (input_custom_tag | string) %}
    {% if t|length > 0 %}
      {{ t }}
    {% else %}
      {{ default_tag }}
    {% endif %}

  # Buttons (inkl. Stopp für Periodik)
  action_buttons: >
    {% set acts = [] %}
    {% if a1_enabled %}
      {% if a1_type == 'uri' %}
        {% set acts = acts + [ {'action':'URI_1','title':a1_title,'uri':a1_uri,'destructive': a1_destructive} ] %}
      {% else %}
        {% set acts = acts + [ {'action':'ACT_1','title':a1_title,'destructive': a1_destructive} ] %}
      {% endif %}
    {% endif %}
    {% if a2_enabled %}
      {% if a2_type == 'uri' %}
        {% set acts = acts + [ {'action':'URI_2','title':a2_title,'uri':a2_uri,'destructive': a2_destructive} ] %}
      {% else %}
        {% set acts = acts + [ {'action':'ACT_2','title':a2_title,'destructive': a2_destructive} ] %}
      {% endif %}
    {% endif %}
    {% if a3_enabled %}
      {% if a3_type == 'uri' %}
        {% set acts = acts + [ {'action':'URI_3','title':a3_title,'uri':a3_uri,'destructive': a3_destructive} ] %}
      {% else %}
        {% set acts = acts + [ {'action':'ACT_3','title':a3_title,'destructive': a3_destructive} ] %}
      {% endif %}
    {% endif %}
    {% if is_periodical %}
      {% set acts = acts + [ {'action': action_tag, 'title': input_stop_button_text} ] %}
    {% endif %}
    {{ acts }}

  # State-Evaluation
  new_state: >
    {% if is_period_trigger %}
      {{ states(entity) }}
    {% else %}
      {{ trigger.to_state.state if trigger.to_state else 'unknown' }}
    {% endif %}
  old_state: >
    {% if is_period_trigger %}
      {{ trigger.event.data.last_state }}
    {% else %}
      {{ trigger.from_state.state if trigger.from_state else 'unknown' }}
    {% endif %}

  # Benachrichtigungsziele
  notify_devices: "{{ input_notify_devices | map('device_attr', 'name') | list }}"
  notify: >
    {% set result = namespace(r=[]) %}
    {% for device in notify_devices %}
      {% set result.r = result.r + ['notify.mobile_app_' + device | slugify] %}
    {% endfor %}
    {% for group in input_notify_groups %}
      {% set result.r = result.r + ['notify.' + group] %}
    {% endfor %}
    {{ result.r }}

  # Multi-State Mapping
  ms_index: >
    {% set lst = ms_entities | list %}
    {% if entity in lst %}{{ lst.index(entity) }}{% else %}-1{% endif %}
  ms_states_for_entity: >
    {% set states_list = ms_target_states | list %}
    {% if ms_index >= 0 and ms_index < states_list|length %}
      {% set raw = (states_list[ms_index] | string) %}
      {{ (raw | replace(',', '|') | lower).split('|') | map('trim') | list }}
    {% else %}
      {{ [] }}
    {% endif %}

  # Multi-Numeric Mapping: Operator + Wert aus nm_thresholds parsen
  nm_index: >
    {% set lst = nm_entities | list %}
    {% if entity in lst %}{{ lst.index(entity) }}{% else %}-1{% endif %}

  nm_op_for_entity: >
    {% set ths = nm_thresholds | list %}
    {% if nm_index >= 0 and nm_index < ths|length %}
      {% set raw = (ths[nm_index] | string).strip() %}
      {% set first = raw[:1] %}
      {% if first == '<' %}
        {{ 'below' }}
      {% elif first == '>' %}
        {{ 'above' }}
      {% else %}
        {{ 'above' }}
      {% endif %}
    {% else %}
      {{ 'above' }}
    {% endif %}

  nm_val_for_entity: >
    {% set ths = nm_thresholds | list %}
    {% if nm_index >= 0 and nm_index < ths|length %}
      {% set raw = (ths[nm_index] | string).strip() %}
      {% set valpart = (raw[1:] if raw[:1] in ['<','>'] else raw) %}
      {% set cleaned = valpart.replace(',', '.').strip() %}
      {{ cleaned | float(0) }}
    {% else %}
      {{ 0 }}
    {% endif %}

  # Zielzustand vor/nach der Änderung (Mehrere Zustände). Rohwerte direkt aus
  # trigger.*_state, damit die Typumwandlung der Variablen nicht dazwischenfunkt
  ms_new_active: >
    {% if trigger.id == 'ms' and trigger.to_state %}
      {{ (trigger.to_state.state | lower) in ms_states_for_entity }}
    {% else %}
      {{ false }}
    {% endif %}
  ms_old_active: >
    {% if trigger.id == 'ms' and trigger.from_state %}
      {{ (trigger.from_state.state | lower) in ms_states_for_entity }}
    {% else %}
      {{ false }}
    {% endif %}

  # Multi-Numerik: nicht-numerisch (unavailable, unknown, ...) zählt nie als
  # "jenseits der Schwelle"
  nm_new_numeric: >
    {{ trigger.id == 'num_multi' and trigger.to_state is not none
       and trigger.to_state.state | is_number }}
  nm_new_active: >
    {% if nm_new_numeric %}
      {% set v = trigger.to_state.state | float %}
      {{ (v > nm_val_for_entity) if nm_op_for_entity == 'above' else (v < nm_val_for_entity) }}
    {% else %}
      {{ false }}
    {% endif %}
  nm_old_active: >
    {% if trigger.id == 'num_multi' and trigger.from_state is not none
          and trigger.from_state.state | is_number %}
      {% set v = trigger.from_state.state | float %}
      {{ (v > nm_val_for_entity) if nm_op_for_entity == 'above' else (v < nm_val_for_entity) }}
    {% else %}
      {{ false }}
    {% endif %}

  # Trigger-Bewertung (inkl. Multi-State und Multi-Numeric)
  # Melden nur beim Eintritt (Flanke), nicht bei jeder weiteren Änderung
  create_notification: >
    {{
      trigger.id in ['state_on','period']
      or (trigger.id == 'num_multi' and nm_new_active and not nm_old_active)
      or (trigger.id == 'ms' and ms_new_active and not ms_old_active)
    }}
  # Löschen nur, wenn vorher gemeldet wurde (from_state im Zielzustand bzw.
  # jenseits der Schwelle). Multi-Numerik: nicht-numerischer neuer Zustand -> nichts tun
  clear_notification: >
    {{
      (trigger.id == 'state_off' and trigger.from_state is not none
       and trigger.from_state.state in input_entity_states)
      or (trigger.id == 'num_multi' and nm_new_numeric and nm_old_active and not nm_new_active)
      or (trigger.id == 'ms' and ms_old_active and not ms_new_active)
    }}

conditions:
  # Periodik-Events anderer Automationen ignorieren ("this" ist hier zur
  # Laufzeit aktuell, auch nach einem Reload)
  - condition: template
    value_template: >
      {{ trigger.id != 'period' or trigger.event.data.automation == this.entity_id }}
  - condition: or
    conditions:
      # Auto-Löschung nur, wenn der Zielzustand tatsächlich verlassen wurde
      - condition: template
        value_template: "{{ clear_notification and input_notification_auto_delete }}"
      - condition: and
        conditions:
          - condition: and
            conditions: !input input_custom_condition
          - condition: template
            value_template: "{{ create_notification }}"

actions:
  - if:
      - condition: template
        value_template: "{{ create_notification }}"
    then:

      # Multi-Numerik: Verweilzeit (Entprellung). Gewartet wird auf "wieder im
      # Normalbereich" (oder nicht-numerisch). Kommt das vor Ablauf -> Lauf beenden.
      # Nur wenn die Schwelle die ganze Dauer überschritten blieb (Timeout) -> melden.
      - if:
          - condition: template
            value_template: >
              {{ trigger.id == 'num_multi' and
                 ( (input_numeric_entity_state_duration.hours|int(0) > 0)
                   or (input_numeric_entity_state_duration.minutes|int(0) > 0)
                   or (input_numeric_entity_state_duration.seconds|int(0) > 0) ) }}
        then:
          - wait_template: >
              {% set s = states(entity) %}
              {% if s | is_number %}
                {% set v = s | float %}
                {{ not ((v > nm_val_for_entity) if nm_op_for_entity == 'above' else (v < nm_val_for_entity)) }}
              {% else %}
                {{ true }}
              {% endif %}
            timeout: !input input_numeric_entity_state_duration
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              - stop: "Schwelle vor Ablauf der Verweilzeit wieder unterschritten"

      # Mehrere Zustände: Verweilzeit analog (vorher "for" am Trigger)
      - if:
          - condition: template
            value_template: >
              {% set d = input_entity_state_duration %}
              {{ trigger.id == 'ms' and
                 ( (d.hours|int(0) > 0) or (d.minutes|int(0) > 0) or (d.seconds|int(0) > 0) ) }}
        then:
          - wait_template: >
              {{ (states(entity) | lower) not in ms_states_for_entity }}
            timeout: !input input_entity_state_duration
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: "{{ wait.completed }}"
            then:
              - stop: "Zielzustand vor Ablauf der Verweilzeit verlassen"

      # Ältere noch wartende Läufe (Periodik / Aktions-Timeout) derselben
      # Entität beenden, damit keine doppelten Schleifen/Aktionen entstehen
      - event: esn_cancel
        event_data:
          automation: "{{ this.entity_id }}"
          entity: "{{ entity }}"

      # HA-Frontend-Notification (optional)
      - if:
          - condition: template
            value_template: !input input_ha_notification
        then:
          - action: persistent_notification.create
            data:
              title: !input input_title
              message: !input input_message
              notification_id: "{{ tag }}"

      # Eigene Eintrittsaktion
      - variables:
          custom_action_on: !input input_custom_action_on
      - if:
          - condition: template
            value_template: "{{ custom_action_on != none }}"
        then:
          - choose: []
            default: !input input_custom_action_on

      # Mobile/Gruppen-Benachrichtigung(en)
      - repeat:
          count: "{{ notify | count | int }}"
          sequence:
            - variables:
                index: "{{ repeat.index-1 }}"
                notify_target: "{{ notify[index] }}"
            - action: "{{ notify_target }}"
              data:
                title: !input input_title
                message: !input input_message
                data:
                  ttl: 0
                  priority: high
                  tag: "{{ tag }}"
                  persistent: !input input_persistent_notification
                  sticky: !input input_persistent_notification
                  group: !input input_group_text
                  push:
                    interruption-level: !input input_interruption_level
                    sound: !input input_ios_sound
                  actions: "{{ action_buttons }}"

      # -------------------------------------------------------------
      # KOMBINIERTE WARTE-LOGIK (Periodik & Actions)
      # -------------------------------------------------------------
      - variables:
          # Bestimme Timeout:
          # Wenn periodisch, dann Periodendauer. Sonst Action-Timeout.
          wait_timeout_seconds: >
            {% if is_periodical %}
              {{ period_seconds }}
            {% else %}
              {{ timedelta(**input_action_timeout).total_seconds() | int }}
            {% endif %}

      - wait_for_trigger:
          - trigger: event
            event_type: mobile_app_notification_action
            event_data:
              tag: "{{ tag }}"
          # Abbruch durch neueren Lauf derselben Entität
          - trigger: event
            event_type: esn_cancel
            event_data:
              automation: "{{ this.entity_id }}"
              entity: "{{ entity }}"
        timeout: "{{ wait_timeout_seconds }}"

      # Auswerten was passiert ist (Timeout oder Action)
      - variables:
          # wait.trigger nicht als Ganzes in eine Variable legen (wird dabei zum
          # String) - nur die benötigten Felder übernehmen
          waited_event_type: "{{ wait.trigger.event.event_type if wait.trigger else '' }}"
          pressed_action: "{{ wait.trigger.event.data.action if wait.trigger else '' }}"

          # Logik für Periodik-Check (Zustand noch gültig?)
          latest_state: "{{ states(entity) }}"
          latest_trigger_id: >
            {% if is_period_trigger %}
              {{ trigger.event.data.trigger_id }}
            {% else %}
              {{ trigger.id }}
            {% endif %}

          # Prüfe, ob die Ursprungsbedingung immer noch wahr ist
          # (ms_on / num_multi_on: Trigger-IDs bis v1.4, für laufende Periodik-Events)
          latest_state_condition: >
            {% set s = states(entity) %}
            {% if latest_trigger_id == 'state_on' %}
              {{ s in input_entity_states }}
            {% elif latest_trigger_id in ['ms', 'ms_on'] %}
              {{ (s | lower) in ms_states_for_entity }}
            {% elif latest_trigger_id in ['num_multi', 'num_multi_on'] and s | is_number %}
              {% set v = s | float %}
              {{ (v > nm_val_for_entity) if nm_op_for_entity == 'above' else (v < nm_val_for_entity) }}
            {% else %}
              {{ false }}
            {% endif %}

      - choose:
          # FALL 1: Timeout ist abgelaufen UND Periodik ist aktiv UND Zustand gilt noch
          # -> Neustart der Schleife (Periodik)
          - conditions:
              - condition: template
                value_template: "{{ waited_event_type == '' and is_periodical }}"
              - condition: template
                value_template: "{{ latest_state_condition }}"
            sequence:
              - event: esn_event
                event_data:
                  entity: "{{ entity }}"
                  automation: "{{ this.entity_id }}"
                  last_state: "{{ latest_state }}"
                  trigger_id: "{{ latest_trigger_id }}"

          # FALL 2: Eine Aktion wurde gedrückt
          # (esn_cancel = von neuerem Lauf abgebrochen -> nichts tun)
          - conditions:
              - condition: template
                value_template: >
                  {{ waited_event_type == 'mobile_app_notification_action' }}
            sequence:
              - choose:
                  # ACTION 1
                  - conditions:
                      - condition: template
                        value_template: "{{ pressed_action == 'ACT_1' }}"
                      - condition: template
                        value_template: "{{ a1_enabled and a1_type == 'ha_action' }}"
                    sequence: !input input_action1_ha_action

                  # ACTION 2
                  - conditions:
                      - condition: template
                        value_template: "{{ pressed_action == 'ACT_2' }}"
                      - condition: template
                        value_template: "{{ a2_enabled and a2_type == 'ha_action' }}"
                    sequence: !input input_action2_ha_action

                  # ACTION 3
                  - conditions:
                      - condition: template
                        value_template: "{{ pressed_action == 'ACT_3' }}"
                      - condition: template
                        value_template: "{{ a3_enabled and a3_type == 'ha_action' }}"
                    sequence: !input input_action3_ha_action

                  # Stop Button: Nichts tun (Loop endet hier, da kein 'event' gefeuert wird)

    else:
      # Benachrichtigungen löschen (Clear) - an dieselben Ziele wie beim Senden.
      # Erreichbar nur bei clear_notification (siehe conditions), d. h. wenn
      # vorher tatsächlich gemeldet wurde.
      - repeat:
          count: "{{ notify | count | int }}"
          sequence:
            - variables:
                index: "{{ repeat.index-1 }}"
                notify_target: "{{ notify[index] }}"
            - action: "{{ notify_target }}"
              data:
                message: clear_notification
                data:
                  tag: "{{ tag }}"
                  ttl: 0
                  priority: high
      - action: persistent_notification.dismiss
        data:
          notification_id: "{{ tag }}"

      # Eigene Verlassen-Aktion
      - variables:
          custom_action_off: !input input_custom_action_off
      - if:
          - condition: template
            value_template: "{{ custom_action_off != none }}"
        then:
          - choose: []
            default: !input input_custom_action_off

mode: parallel
max: 20
